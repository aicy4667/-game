<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>年終大抽獎 - 3D 摸彩球系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle, #1a1a2e 0%, #16213e 100%);
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        .interactive {
            pointer-events: auto;
        }
        canvas { display: block; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 1rem;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .float-animation {
            animation: float 3s ease-in-out infinite;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div id="ui-layer">
    <!-- 頂部標題 -->
    <div class="p-6 text-center">
        <h1 class="text-4xl font-bold text-yellow-400 drop-shadow-lg tracking-widest">YEAR-END LUCKY DRAW</h1>
        <p class="text-white opacity-80 mt-2">年終大抽獎 - 幸運球模擬系統</p>
    </div>

    <!-- 左側控制面板 -->
    <div class="absolute left-6 top-24 w-80 interactive">
        <div class="glass-panel p-5 text-white shadow-2xl space-y-4">
            <h3 class="text-xl font-semibold border-b border-white/20 pb-2 flex justify-between items-center">
                <span>抽獎設定</span>
                <span id="ball-count-badge" class="bg-yellow-500 text-black text-xs px-2 py-1 rounded-full">球數: 0</span>
            </h3>
            
            <div>
                <label class="block text-sm mb-1 opacity-70 font-bold text-yellow-400">1. 輸入所有參加者名單</label>
                <textarea id="names-input" rows="5" class="w-full bg-white/10 border border-white/30 rounded px-3 py-2 text-sm outline-none focus:border-yellow-400" placeholder="每行一個姓名...">小明
小紅
張經理
陳課長
王阿姨
李大叔
林小姐
阿強
Lucky Seven
大獎得主</textarea>
            </div>

            <div>
                <label class="block text-sm mb-1 opacity-70 font-bold text-yellow-400">2. 設定抽獎獎項</label>
                <select id="prize-selector" class="w-full bg-blue-900/50 border border-white/30 rounded px-3 py-2 mb-2 outline-none focus:border-yellow-400">
                    <!-- 由 JS 動態生成 -->
                </select>
                <textarea id="prize-config" rows="3" class="w-full bg-white/10 border border-white/30 rounded px-3 py-2 text-xs outline-none focus:border-yellow-400" placeholder="格式：獎項名稱, 抽出人數">特等獎, 1
壹等獎, 2
貳等獎, 5</textarea>
                <p class="text-[10px] opacity-50 mt-1">格式：獎項名稱, 抽出人數 (每行一個)</p>
            </div>

            <button id="update-btn" class="w-full bg-blue-600 hover:bg-blue-500 transition-colors rounded py-2 font-bold shadow-lg">更新抽獎配置</button>
        </div>
    </div>

    <!-- 右側中獎記錄 -->
    <div class="absolute right-6 top-24 w-72 interactive">
        <div class="glass-panel p-5 text-white shadow-2xl max-h-[70vh] flex flex-col">
            <h3 class="text-xl font-semibold mb-4 border-b border-white/20 pb-2">獲獎名單</h3>
            <div id="winners-list" class="overflow-y-auto flex-grow space-y-2 pr-2 custom-scrollbar text-sm">
                <p class="text-xs opacity-50 italic text-center">尚未有人中獎...</p>
            </div>
            <button id="clear-btn" class="mt-4 text-xs text-white/40 hover:text-red-400 transition-colors">清除中獎記錄</button>
        </div>
    </div>

    <!-- 中央抽獎控制區 -->
    <div class="absolute bottom-12 left-1/2 -translate-x-1/2 interactive text-center">
        <div id="current-target-display" class="mb-4 text-white text-lg font-bold bg-black/40 px-6 py-2 rounded-full inline-block border border-yellow-500/50">
            當前抽獎：<span id="current-prize-name" class="text-yellow-400">--</span> 
            (尚需抽出 <span id="current-prize-count" class="text-yellow-400">0</span> 人)
        </div>
        <br>
        <button id="draw-btn" class="float-animation bg-gradient-to-r from-red-600 to-yellow-500 hover:from-red-500 hover:to-yellow-400 text-white px-12 py-4 rounded-full text-2xl font-black shadow-[0_0_30px_rgba(234,179,8,0.5)] transition-all transform hover:scale-110 active:scale-95 disabled:opacity-50 disabled:grayscale">
            按下開始抽獎！
        </button>
    </div>

    <!-- 得獎彈窗 -->
    <div id="result-modal" class="fixed inset-0 bg-black/90 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-500 z-50 interactive">
        <div class="text-center p-12 glass-panel border-yellow-500/50 scale-75 transition-transform duration-500" id="modal-content">
            <div class="text-yellow-400 text-2xl mb-2 font-bold tracking-widest">CONGRATULATIONS</div>
            <h2 id="modal-prize" class="text-white text-3xl font-bold mb-6 border-b border-white/20 pb-4"></h2>
            <div id="modal-name" class="text-white text-8xl font-black mb-10 drop-shadow-[0_0_30px_rgba(255,255,255,0.6)]"></div>
            <button id="close-modal" class="bg-yellow-500 text-black px-12 py-3 rounded-full font-black text-lg hover:bg-yellow-400 transition-all shadow-xl">收下大獎</button>
        </div>
    </div>
</div>

<script>
    // --- 初始化變數 ---
    let scene, camera, renderer, world;
    let balls = [];
    const BALL_RADIUS = 0.5;
    let participants = [];
    let prizes = []; // { name: string, total: number, drawn: number }
    let currentPrizeIndex = 0;
    let isDrawing = false;

    // --- 初始化物理引擎 ---
    function initPhysics() {
        world = new CANNON.World();
        world.gravity.set(0, -9.82, 0);
        world.broadphase = new CANNON.NaiveBroadphase();
        world.solver.iterations = 10;

        const groundMat = new CANNON.Material();
        const wallMat = new CANNON.Material();
        
        const groundBody = new CANNON.Body({ mass: 0, material: groundMat });
        groundBody.addShape(new CANNON.Plane());
        groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
        groundBody.position.set(0, -5, 0);
        world.addBody(groundBody);

        const wallPositions = [
            { pos: [5, 0, 0], rot: [0, -Math.PI/2, 0] },
            { pos: [-5, 0, 0], rot: [0, Math.PI/2, 0] },
            { pos: [0, 0, 5], rot: [0, Math.PI, 0] },
            { pos: [0, 0, -5], rot: [0, 0, 0] },
            { pos: [0, 8, 0], rot: [Math.PI/2, 0, 0] }
        ];

        wallPositions.forEach(p => {
            const body = new CANNON.Body({ mass: 0, material: wallMat });
            body.addShape(new CANNON.Plane());
            body.position.set(...p.pos);
            body.quaternion.setFromEuler(...p.rot);
            world.addBody(body);
        });

        const contactMat = new CANNON.ContactMaterial(groundMat, wallMat, { friction: 0.1, restitution: 0.7 });
        world.addContactMaterial(contactMat);
    }

    // --- 初始化渲染器 ---
    function initThree() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 15);
        camera.lookAt(0, 0, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const pointLight = new THREE.PointLight(0xffcc00, 1.2);
        pointLight.position.set(5, 10, 5);
        scene.add(pointLight);

        // 摸彩箱
        const boxGeo = new THREE.IcosahedronGeometry(6, 1);
        const boxMat = new THREE.MeshPhongMaterial({
            color: 0xaaaaaa,
            transparent: true,
            opacity: 0.15,
            wireframe: true
        });
        scene.add(new THREE.Mesh(boxGeo, boxMat));

        // 底座
        const baseGeo = new THREE.CylinderGeometry(6, 7, 1, 32);
        const baseMat = new THREE.MeshStandardMaterial({ color: 0x990000, roughness: 0.3, metalness: 0.8 });
        const base = new THREE.Mesh(baseGeo, baseMat);
        base.position.y = -5.5;
        scene.add(base);
    }

    // --- 球類管理 ---
    function createBall(label) {
        const body = new CANNON.Body({
            mass: 1,
            shape: new CANNON.Sphere(BALL_RADIUS),
            position: new CANNON.Vec3((Math.random()-0.5)*6, Math.random()*5, (Math.random()-0.5)*6)
        });
        body.velocity.set(Math.random()*2, 5, Math.random()*2);
        world.addBody(body);

        const group = new THREE.Group();
        const ballMat = new THREE.MeshPhongMaterial({ 
            color: new THREE.Color(`hsl(${Math.random() * 360}, 75%, 60%)`)
        });
        group.add(new THREE.Mesh(new THREE.SphereGeometry(BALL_RADIUS, 16, 16), ballMat));

        // 標籤
        const canvas = document.createElement('canvas');
        canvas.width = 128; canvas.height = 128;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = 'white'; ctx.fillRect(0, 0, 128, 128);
        ctx.fillStyle = 'black'; ctx.font = 'Bold 55px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(label.substring(0, 3), 64, 64);
        
        const texture = new THREE.CanvasTexture(canvas);
        const labelMesh = new THREE.Mesh(
            new THREE.SphereGeometry(BALL_RADIUS + 0.01, 16, 16), 
            new THREE.MeshBasicMaterial({ map: texture, transparent: true, opacity: 0.9 })
        );
        group.add(labelMesh);
        scene.add(group);
        
        return { body, visual: group, name: label };
    }

    // --- 更新配置 ---
    function updateConfig() {
        // 1. 更新名單
        const namesText = document.getElementById('names-input').value;
        participants = namesText.split('\n').map(s => s.trim()).filter(s => s !== "");
        
        // 2. 更新獎項
        const prizeText = document.getElementById('prize-config').value;
        prizes = prizeText.split('\n').map(line => {
            const [name, count] = line.split(',').map(s => s.trim());
            return { name: name || "未命名獎項", total: parseInt(count) || 1, drawn: 0 };
        }).filter(p => p.name !== "");

        // 更新下拉選單
        const selector = document.getElementById('prize-selector');
        selector.innerHTML = '';
        prizes.forEach((p, index) => {
            const opt = document.createElement('option');
            opt.value = index;
            opt.innerText = `${p.name} (共 ${p.total} 名)`;
            selector.appendChild(opt);
        });
        
        currentPrizeIndex = selector.value || 0;
        updateUI();

        // 3. 重新生成球
        balls.forEach(b => { world.remove(b.body); scene.remove(b.visual); });
        balls = [];
        participants.forEach(name => balls.push(createBall(name)));
        
        document.getElementById('ball-count-badge').innerText = `球數: ${balls.length}`;
    }

    function updateUI() {
        const p = prizes[currentPrizeIndex];
        if (p) {
            document.getElementById('current-prize-name').innerText = p.name;
            document.getElementById('current-prize-count').innerText = Math.max(0, p.total - p.drawn);
            document.getElementById('draw-btn').disabled = (p.total - p.drawn <= 0 || balls.length === 0);
        }
    }

    // --- 動畫 ---
    function animate() {
        requestAnimationFrame(animate);
        world.step(1/60);
        balls.forEach(b => {
            b.visual.position.copy(b.body.position);
            b.visual.quaternion.copy(b.body.quaternion);
            if (b.body.velocity.length() < 1.5) {
                b.body.applyImpulse(new CANNON.Vec3((Math.random()-0.5)*3, 8, (Math.random()-0.5)*3), b.body.position);
            }
        });
        renderer.render(scene, camera);
    }

    // --- 抽獎 ---
    function startDraw() {
        if (isDrawing || balls.length === 0) return;
        const p = prizes[currentPrizeIndex];
        if (p.drawn >= p.total) return;

        isDrawing = true;
        const btn = document.getElementById('draw-btn');
        btn.disabled = true;
        btn.innerText = "正在抽獎...";

        // 視覺加速
        balls.forEach(b => b.body.velocity.set((Math.random()-0.5)*25, 30, (Math.random()-0.5)*25));

        setTimeout(() => {
            const luckyIdx = Math.floor(Math.random() * balls.length);
            const winner = balls[luckyIdx];
            
            p.drawn++;
            showResult(p.name, winner.name);
            
            // 移除球
            world.remove(winner.body);
            scene.remove(winner.visual);
            balls.splice(luckyIdx, 1);
            
            btn.innerText = "按下開始抽獎！";
            isDrawing = false;
            updateUI();
            document.getElementById('ball-count-badge').innerText = `球數: ${balls.length}`;
        }, 2000);
    }

    function showResult(prizeName, winnerName) {
        document.getElementById('modal-prize').innerText = prizeName;
        document.getElementById('modal-name').innerText = winnerName;
        const modal = document.getElementById('result-modal');
        modal.classList.remove('pointer-events-none', 'opacity-0');
        document.getElementById('modal-content').classList.remove('scale-75');

        confetti({ particleCount: 200, spread: 80, origin: { y: 0.6 } });

        const list = document.getElementById('winners-list');
        if (list.querySelector('p')) list.innerHTML = '';
        const item = document.createElement('div');
        item.className = "bg-white/10 p-2 rounded flex justify-between border-l-4 border-yellow-500 mb-1";
        item.innerHTML = `<span>${prizeName}</span><span class="font-bold text-yellow-400">${winnerName}</span>`;
        list.prepend(item);
    }

    window.onload = () => {
        initPhysics();
        initThree();
        updateConfig();
        animate();

        document.getElementById('update-btn').onclick = updateConfig;
        document.getElementById('draw-btn').onclick = startDraw;
        document.getElementById('prize-selector').onchange = (e) => {
            currentPrizeIndex = e.target.value;
            updateUI();
        };
        document.getElementById('close-modal').onclick = () => {
            document.getElementById('result-modal').classList.add('pointer-events-none', 'opacity-0');
            document.getElementById('modal-content').classList.add('scale-75');
        };
        document.getElementById('clear-btn').onclick = () => {
            document.getElementById('winners-list').innerHTML = '<p class="text-xs opacity-50 italic text-center">尚未有人中獎...</p>';
            prizes.forEach(p => p.drawn = 0);
            updateUI();
        };
        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };
    };
</script>

</body>
</html>
