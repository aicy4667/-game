<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奇異生技 2026 鴻運尾牙抽獎</title>
    <!-- 修正連結：移除 Markdown 語法，確保 Tailwind 與字體能正確載入 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Serif TC', serif;
            /* 背景：深紅至暗紅的年節漸層 */
            background: radial-gradient(circle at center, #7f1d1d 0%, #450a0a 100%);
            color: #fde68a; /* 淺金色文字 */
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* 轉盤主體：年節金色風格 */
        .lottery-machine {
            width: 340px;
            height: 340px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.3);
            border: 8px solid #fbbf24; /* 金色邊框 */
            box-shadow: 0 0 50px rgba(251, 191, 36, 0.5), inset 0 0 30px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto; /* 確保置中 */
        }

        .ball {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            position: absolute;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.5);
            z-index: 10;
        }

        /* 紅金配色彩球 */
        .ball-red { background: radial-gradient(circle at 30% 30%, #ef4444, #7f1d1d); }
        .ball-gold { background: radial-gradient(circle at 30% 30%, #fde68a, #b45309); }

        .drum-shaking {
            animation: shake 0.1s infinite alternate ease-in-out;
        }

        @keyframes shake {
            from { transform: translate(2px, 2px); }
            to { transform: translate(-2px, -2px); }
        }

        /* 燈籠裝飾：調整位置避免遮擋手機版文字 */
        .lantern {
            position: fixed;
            width: 80px;
            height: 100px;
            background: #dc2626;
            border-radius: 40px;
            box-shadow: 0 10px 20px rgba(220, 38, 38, 0.4);
            border: 2px solid #fbbf24;
            z-index: 0; /* 改為 0，避免蓋住彈窗但位於背景之上 */
            opacity: 0.6;
            pointer-events: none;
        }
        .lantern::after {
            content: "";
            position: absolute;
            bottom: -20px;
            left: 50%;
            width: 4px;
            height: 20px;
            background: #fbbf24;
        }

        /* 內容容器層級提升，確保壓在燈籠上 */
        .main-container {
            position: relative;
            z-index: 10;
        }

        .prize-active {
            border-color: #fbbf24;
            background: linear-gradient(to right, rgba(127, 29, 29, 0.9), rgba(69, 10, 10, 0.9));
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.3);
            transform: scale(1.02);
        }

        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #fbbf24; border-radius: 10px; }

        .firework {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- 背景燈籠裝飾 -->
    <div class="lantern top-4 left-4 md:top-10 md:left-10 transform -rotate-12"></div>
    <div class="lantern top-4 right-4 md:top-10 md:right-10 transform rotate-12"></div>

    <div class="main-container max-w-7xl mx-auto">
        <header class="text-center mb-10 relative">
            <div class="text-amber-400 text-lg md:text-xl tracking-[0.5em] mb-2 font-bold">丙午馬年・吉星高照</div>
            <h1 class="text-5xl md:text-7xl font-bold tracking-widest text-white drop-shadow-[0_4px_4px_rgba(0,0,0,0.8)]">
                奇異生技 <span class="text-amber-400">2026</span>
            </h1>
            <div class="flex items-center justify-center mt-6">
                <span class="h-px w-12 bg-amber-600"></span>
                <p class="mx-4 text-amber-200 text-lg md:text-xl font-light">歲末尾牙 ‧ 幸運大抽獎</p>
                <span class="h-px w-12 bg-amber-600"></span>
            </div>
        </header>

        <div class="grid grid-cols-1 xl:grid-cols-4 gap-8 mt-8">
            
            <!-- 左側：獎項序列 -->
            <div class="xl:col-span-1 space-y-6 order-2 xl:order-1">
                <div class="bg-black/40 p-6 rounded-[2rem] border-2 border-amber-900/50 backdrop-blur-md shadow-xl">
                    <div class="flex justify-between items-center mb-6 border-b border-amber-800 pb-3">
                        <h2 class="text-xl font-bold flex items-center text-amber-400">
                            <span class="mr-2">🧧</span> 獎項清單
                        </h2>
                        <button onclick="togglePrizeManager()" class="text-xs bg-amber-900/80 px-4 py-1.5 rounded-full text-amber-100 hover:bg-amber-700 transition border border-amber-700">編輯</button>
                    </div>
                    <div id="prizeDisplayList" class="space-y-4 max-h-[400px] overflow-y-auto pr-2 custom-scroll">
                        <!-- 獎項卡片 -->
                    </div>
                </div>

                <div class="bg-black/40 p-6 rounded-[2rem] border-2 border-amber-900/50 backdrop-blur-md shadow-xl">
                    <h2 class="text-xl font-bold mb-4 border-b border-amber-800 pb-3 flex items-center text-amber-400">
                        <span class="mr-2">🏮</span> 參加名單
                    </h2>
                    <textarea id="participantsInput" onchange="updateParticipants()" class="w-full h-32 bg-red-950/40 border border-amber-900 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 mb-2 custom-scroll text-amber-100 placeholder-amber-900/50" placeholder="請輸入名單，每行一位..."></textarea>
                    <p class="text-xs text-amber-600 text-center italic">目前共有 <span id="participantCount" class="font-bold text-amber-400 text-base">0</span> 名同仁參與</p>
                </div>
            </div>

            <!-- 中間：抽獎區 -->
            <div class="xl:col-span-2 flex flex-col items-center justify-start order-1 xl:order-2 pt-4">
                <div class="mb-10 text-center">
                    <h3 id="currentPrizeName" class="text-4xl md:text-5xl font-bold text-amber-400 mb-3 tracking-widest drop-shadow-md animate-pulse">準備中</h3>
                    <div id="currentPrizeDetail" class="text-2xl md:text-3xl text-white font-bold opacity-90">請點擊開始</div>
                </div>

                <div id="machine" class="lottery-machine mb-12">
                    <div id="ballContainer"></div>
                </div>

                <button id="drawBtn" onclick="startDraw()" class="group relative px-20 py-6 bg-gradient-to-b from-amber-400 to-amber-600 hover:from-amber-300 hover:to-amber-500 rounded-full text-3xl font-black text-red-950 shadow-[0_10px_30px_rgba(251,191,36,0.3)] transition-all transform hover:scale-105 active:scale-95 disabled:grayscale disabled:opacity-50 border-4 border-amber-200">
                    <span class="tracking-[0.3em]">開運抽獎</span>
                    <div class="absolute -top-3 -right-3 text-3xl animate-bounce">✨</div>
                </button>
            </div>

            <!-- 右側：中獎名單 -->
            <div class="xl:col-span-1 bg-black/40 p-6 rounded-[2rem] border-2 border-amber-900/50 backdrop-blur-md order-3 shadow-xl">
                <h2 class="text-xl font-bold mb-6 border-b border-amber-800 pb-3 flex items-center text-amber-400">
                    <span class="mr-2">📜</span> 鴻運榜單
                </h2>
                <div id="historyList" class="space-y-4 max-h-[550px] overflow-y-auto pr-2 custom-scroll">
                    <p class="text-amber-900/70 text-center py-20 text-sm italic">等待好運降臨...</p>
                </div>
                <button onclick="exportWinners()" class="mt-6 w-full py-3 bg-red-900/50 text-amber-400 border border-amber-900 hover:bg-red-800 rounded-xl transition font-bold text-sm">匯出紀錄 CSV</button>
            </div>
        </div>
    </div>

    <!-- 獎項編輯彈窗 -->
    <div id="prizeManagerModal" class="fixed inset-0 modal-bg z-[100] hidden flex items-center justify-center p-6 bg-black/80 backdrop-blur-sm">
        <div class="bg-red-950 border-2 border-amber-500 rounded-[3rem] p-8 max-w-2xl w-full shadow-2xl flex flex-col max-h-[85vh]">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-bold text-amber-400">設置獎項內容</h3>
                <button onclick="addPrize()" class="bg-amber-600 text-red-950 px-4 py-2 rounded-full text-xs font-bold hover:bg-amber-500">+ 新增</button>
            </div>
            <div id="prizeEditList" class="overflow-y-auto flex-grow space-y-4 mb-6 pr-2 custom-scroll text-amber-100"></div>
            <div class="flex gap-4">
                <button onclick="saveAndClosePrizeManager()" class="flex-grow py-4 bg-amber-500 hover:bg-amber-400 text-red-950 rounded-2xl font-bold transition">確定儲存</button>
                <button onclick="togglePrizeManager()" class="px-8 py-4 bg-red-900 hover:bg-red-800 text-white rounded-2xl font-bold transition">返回</button>
            </div>
        </div>
    </div>

    <!-- 中獎驚喜彈窗 -->
    <div id="winModal" class="fixed inset-0 modal-bg z-[200] hidden flex items-center justify-center p-4 bg-black/90 backdrop-blur-md">
        <div class="bg-gradient-to-b from-red-600 to-red-900 border-4 border-amber-400 rounded-[4rem] p-12 max-w-md w-full text-center shadow-[0_0_100px_rgba(251,191,36,0.6)] transform animate-in zoom-in duration-300 relative overflow-hidden">
            <!-- 裝飾花紋 -->
            <div class="absolute top-0 left-0 text-amber-200/10 text-[10rem] font-serif leading-none select-none">囍</div>
            <div class="absolute bottom-0 right-0 text-amber-200/10 text-[10rem] font-serif leading-none select-none">發</div>
            
            <h4 class="text-amber-300 text-2xl font-bold mb-2 tracking-[0.5em] uppercase relative z-10">恭喜發財</h4>
            <div id="winPrizeLabel" class="text-white text-xl mb-6 font-medium bg-black/20 py-2 px-4 rounded-full inline-block relative z-10 border border-white/20"></div>
            <div id="winName" class="text-7xl font-black text-amber-400 mb-10 drop-shadow-lg relative z-10"></div>
            <button onclick="closeModal()" class="w-full py-5 bg-amber-400 hover:bg-amber-300 text-red-950 rounded-2xl font-black text-2xl transition-all shadow-[0_8px_0_rgb(180,83,9)] active:shadow-none active:translate-y-2 relative z-10">領取好運</button>
        </div>
    </div>

    <script>
        // 音效系統
        const SFX = {
            ctx: null,
            init() { if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
            tick() {
                if(!this.ctx) return;
                const o = this.ctx.createOscillator(), g = this.ctx.createGain();
                o.type = 'sine'; o.frequency.setValueAtTime(150 + Math.random()*50, this.ctx.currentTime);
                g.gain.setValueAtTime(0.06, this.ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
                o.connect(g); g.connect(this.ctx.destination);
                o.start(); o.stop(this.ctx.currentTime + 0.08);
            },
            win() {
                if(!this.ctx) return;
                const notes = [523, 659, 784, 1046, 1318]; // C E G C E
                notes.forEach((f, i) => {
                    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
                    o.type = 'triangle'; o.frequency.setValueAtTime(f, this.ctx.currentTime + i*0.1);
                    g.gain.setValueAtTime(0.1, this.ctx.currentTime + i*0.1);
                    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + i*0.1 + 1.0);
                    o.connect(g); g.connect(this.ctx.destination);
                    o.start(this.ctx.currentTime + i*0.1); o.stop(this.ctx.currentTime + i*0.1 + 1.0);
                });
            }
        };

        // 預設資料
        let participants = ["Mandy", "TINA", "TIFFANY", "紅水", "蕙瑄", "佳琪", "林定葦", "林定賢"];
        let prizes = [
            { id: 1, name: "頭獎", detail: "$12,888", count: 1, drawn: 0 },
            { id: 2, name: "二獎", detail: "$8,888", count: 1, drawn: 0 },
            { id: 3, name: "三獎", detail: "$6,888", count: 1, drawn: 0 },
            { id: 4, name: "四獎", detail: "$2,888", count: 2, drawn: 0 },
            { id: 5, name: "五獎", detail: "$1,888", count: 3, drawn: 0 }
        ];

        let currentPrizeIndex = prizes.length - 1; 
        let winners = [];
        let isDrawing = false;
        let balls = [];

        window.onload = () => {
            document.getElementById('participantsInput').value = participants.join('\n');
            updateParticipants();
            renderPrizes();
            createBalls(12);
            autoSelectPrize();
            updateCurrentDisplay();
        };

        function renderPrizes() {
            const list = document.getElementById('prizeDisplayList');
            list.innerHTML = prizes.map((p, idx) => `
                <div class="p-4 rounded-2xl border ${idx === currentPrizeIndex ? 'prize-active' : 'bg-red-950/30 border-amber-900/50'} transition-all duration-300">
                    <div class="flex justify-between items-center mb-1">
                        <span class="font-bold text-sm ${idx === currentPrizeIndex ? 'text-amber-300' : 'text-amber-800'}">${p.name}</span>
                        <span class="text-[10px] px-2 py-0.5 ${p.drawn >= p.count ? 'bg-black/40 text-gray-500' : 'bg-amber-950 text-amber-500'} rounded-full">${p.drawn}/${p.count}</span>
                    </div>
                    <div class="text-xl ${idx === currentPrizeIndex ? 'text-white font-bold' : 'text-amber-900 font-light'} truncate">${p.detail}</div>
                </div>
            `).join('');
        }

        function togglePrizeManager() {
            const m = document.getElementById('prizeManagerModal');
            if (m.classList.contains('hidden')) { renderPrizeEditor(); m.classList.remove('hidden'); }
            else { m.classList.add('hidden'); }
        }

        function renderPrizeEditor() {
            const c = document.getElementById('prizeEditList');
            c.innerHTML = prizes.map((p, i) => `
                <div class="grid grid-cols-12 gap-2 bg-black/20 p-4 rounded-2xl border border-amber-900/30 items-center">
                    <div class="col-span-3">
                        <input type="text" value="${p.name}" onchange="prizes[${i}].name=this.value" class="w-full bg-red-950 border border-amber-900 rounded px-2 py-1 text-sm text-amber-100 outline-none focus:border-amber-500">
                    </div>
                    <div class="col-span-5">
                        <input type="text" value="${p.detail}" onchange="prizes[${i}].detail=this.value" class="w-full bg-red-950 border border-amber-900 rounded px-2 py-1 text-sm text-amber-100 outline-none focus:border-amber-500">
                    </div>
                    <div class="col-span-2">
                        <input type="number" value="${p.count}" onchange="prizes[${i}].count=parseInt(this.value)" class="w-full bg-red-950 border border-amber-900 rounded px-2 py-1 text-sm text-amber-100 outline-none focus:border-amber-500">
                    </div>
                    <div class="col-span-2 text-right">
                        <button onclick="prizes.splice(${i},1);renderPrizeEditor()" class="text-amber-600 font-bold hover:text-red-400">✕</button>
                    </div>
                </div>
            `).join('');
        }

        function addPrize() {
            prizes.push({ id: Date.now(), name: "加碼獎", detail: "$0", count: 1, drawn: 0 });
            renderPrizeEditor();
        }

        function saveAndClosePrizeManager() { autoSelectPrize(); updateCurrentDisplay(); togglePrizeManager(); }

        function autoSelectPrize() {
            // 從清單最後一個(五獎)開始往上找
            for (let i = prizes.length - 1; i >= 0; i--) {
                if (prizes[i].drawn < prizes[i].count) { currentPrizeIndex = i; return; }
            }
            currentPrizeIndex = -1;
        }

        function updateParticipants() {
            participants = document.getElementById('participantsInput').value.split('\n').map(n => n.trim()).filter(n => n !== "");
            document.getElementById('participantCount').innerText = participants.length;
        }

        function createBalls(num) {
            const container = document.getElementById('ballContainer');
            container.innerHTML = ''; balls = [];
            for (let i = 0; i < num; i++) {
                const b = document.createElement('div');
                b.className = `ball ${Math.random() > 0.5 ? 'ball-red' : 'ball-gold'}`;
                container.appendChild(b);
                balls.push({ el: b, x: 150, y: 150, vx: (Math.random()-0.5)*18, vy: (Math.random()-0.5)*18 });
            }
        }

        function updateCurrentDisplay() {
            const p = prizes[currentPrizeIndex], btn = document.getElementById('drawBtn');
            if (!p) {
                document.getElementById('currentPrizeName').innerText = "萬事如意";
                document.getElementById('currentPrizeDetail').innerText = "明年再會！";
                btn.disabled = true; btn.innerText = "圓滿結束";
                document.getElementById('currentPrizeName').classList.remove('animate-pulse');
            } else {
                document.getElementById('currentPrizeName').innerText = p.name;
                document.getElementById('currentPrizeDetail').innerText = p.detail;
                btn.disabled = (participants.length === 0);
                btn.innerText = "開運抽獎";
                document.getElementById('currentPrizeName').classList.add('animate-pulse');
            }
            renderPrizes();
        }

        function startDraw() {
            if (isDrawing || participants.length === 0 || currentPrizeIndex === -1) return;
            SFX.init();
            isDrawing = true;
            document.getElementById('drawBtn').disabled = true;
            document.getElementById('machine').classList.add('drum-shaking');
            let start = Date.now();
            
            const frame = () => {
                balls.forEach(b => {
                    b.x += b.vx; b.y += b.vy;
                    // 邊界檢查 (340寬度 - 44球寬 = 296)
                    if (b.x < 0 || b.x > 296) b.vx *= -1;
                    if (b.y < 0 || b.y > 296) b.vy *= -1;
                    b.el.style.transform = `translate(${b.x}px, ${b.y}px)`;
                });
                
                // 隨機播放滾動音效
                if (Math.random() > 0.85) SFX.tick();

                if (Date.now() - start < 3000) {
                    requestAnimationFrame(frame);
                } else {
                    finishDraw();
                }
            };
            requestAnimationFrame(frame);
        }

        function finishDraw() {
            isDrawing = false;
            document.getElementById('machine').classList.remove('drum-shaking');
            
            const winnerIdx = Math.floor(Math.random() * participants.length);
            const name = participants.splice(winnerIdx, 1)[0];
            const p = prizes[currentPrizeIndex];
            p.drawn++;
            
            winners.unshift({ 
                name, 
                pName: p.name, 
                pDetail: p.detail, 
                time: new Date().toLocaleTimeString('zh-TW', {hour12:false}) 
            });
            
            SFX.win();
            createFireworks();
            document.getElementById('winName').innerText = name;
            document.getElementById('winPrizeLabel').innerText = `${p.name}: ${p.detail}`;
            document.getElementById('winModal').classList.remove('hidden');
            
            updateHistory(); 
            updateParticipantsUI(); 
            autoSelectPrize(); 
            updateCurrentDisplay();
        }

        function closeModal() { document.getElementById('winModal').classList.add('hidden'); }

        function updateHistory() {
            const l = document.getElementById('historyList');
            l.innerHTML = winners.map(w => `
                <div class="bg-red-950/30 p-4 rounded-2xl border-l-4 border-amber-500 mb-4 animate-in fade-in slide-in-from-right duration-500">
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-lg text-amber-200">${w.name}</span>
                        <span class="text-[10px] text-amber-900/80">${w.time}</span>
                    </div>
                    <div class="text-sm text-amber-500 mt-1">${w.pName} ‧ ${w.pDetail}</div>
                </div>
            `).join('');
        }

        function updateParticipantsUI() {
            document.getElementById('participantCount').innerText = participants.length;
            document.getElementById('participantsInput').value = participants.join('\n');
        }

        function createFireworks() {
            for(let i=0; i<40; i++) {
                const f = document.createElement('div');
                f.className = 'firework';
                f.style.left = Math.random()*100 + 'vw';
                f.style.top = Math.random()*100 + 'vh';
                f.style.backgroundColor = Math.random() > 0.5 ? '#fbbf24' : '#ef4444';
                f.style.boxShadow = `0 0 ${Math.random()*10 + 5}px ${f.style.backgroundColor}`;
                document.body.appendChild(f);
                
                // 簡單的煙火動畫 (擴散)
                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 100 + 50;
                
                f.animate([
                    { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                    { transform: `translate(${Math.cos(angle)*velocity}px, ${Math.sin(angle)*velocity}px) scale(0)`, opacity: 0 }
                ], {
                    duration: 1000 + Math.random() * 1000,
                    easing: 'ease-out'
                }).onfinish = () => f.remove();
            }
        }

        function exportWinners() {
            const csv = "抽獎時間,中獎者,獎項,內容\n" + winners.map(w=>`${w.time},${w.name},${w.pName},${w.pDetail}`).join('\n');
            const blob = new Blob(["\ufeff"+csv], {type: 'text/csv'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); 
            a.href = url; 
            a.download = '奇異生技_2026尾牙中獎名單.csv'; 
            a.click();
        }
    </script>
</body>
</html>
