<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>年終大抽獎 - 幸運兒抽獎系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle, #1a1a2e 0%, #16213e 100%);
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        .interactive { pointer-events: auto; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 1rem;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
        
        #loading-overlay {
            position: fixed; inset: 0; background: #1a1a2e;
            display: flex; justify-content: center; align-items: center;
            z-index: 100; color: white; transition: opacity 0.5s;
        }

        .step-active { border: 2px solid #fbbf24; box-shadow: 0 0 15px rgba(251, 191, 36, 0.5); }
    </style>
</head>
<body>

<div id="loading-overlay">載入中...</div>

<div id="ui-layer">
    <!-- 標題 -->
    <div class="p-4 text-center">
        <h1 class="text-3xl font-bold text-yellow-400 drop-shadow-lg tracking-widest uppercase">Lucky Person First Draw</h1>
        <p class="text-white opacity-80 text-sm">先抽人，再抽獎！</p>
    </div>

    <!-- 左側設定 -->
    <div class="absolute left-6 top-20 w-72 interactive">
        <div class="glass-panel p-4 text-white shadow-2xl space-y-3">
            <h3 class="text-lg font-semibold border-b border-white/20 pb-1 flex justify-between">
                <span>設定</span>
                <span id="ball-count-badge" class="bg-yellow-500 text-black text-[10px] px-2 py-0.5 rounded-full self-center">球: 0</span>
            </h3>
            
            <div class="space-y-1">
                <label class="text-xs font-bold text-yellow-400">1. 參加者名單</label>
                <textarea id="names-input" rows="4" class="w-full bg-white/10 border border-white/30 rounded px-2 py-1 text-xs outline-none focus:border-yellow-400" placeholder="姓名...">小明
小紅
張經理
陳課長
王阿姨</textarea>
            </div>

            <div class="space-y-1">
                <label class="text-xs font-bold text-yellow-400">2. 獎項池 (剩餘數量)</label>
                <textarea id="prize-config" rows="3" class="w-full bg-white/10 border border-white/30 rounded px-2 py-1 text-[10px] outline-none focus:border-yellow-400" placeholder="格式：獎項, 數量">特等獎, 1
壹等獎, 2
貳等獎, 5
參等獎, 10</textarea>
            </div>

            <button id="update-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-xs rounded py-1.5 font-bold transition-all">更新配置</button>
            <div id="save-status" class="text-[9px] text-center opacity-50"></div>
        </div>
    </div>

    <!-- 右側記錄 -->
    <div class="absolute right-6 top-20 w-64 interactive">
        <div class="glass-panel p-4 text-white shadow-2xl max-h-[60vh] flex flex-col">
            <h3 class="text-lg font-semibold mb-2 border-b border-white/20 pb-1">獲獎名單</h3>
            <div id="winners-list" class="overflow-y-auto flex-grow space-y-1 pr-1 custom-scrollbar text-xs">
                <p class="opacity-50 italic text-center">尚未中獎...</p>
            </div>
            <button id="clear-btn" class="mt-2 text-[10px] text-white/40 hover:text-red-400">清除記錄</button>
        </div>
    </div>

    <!-- 中央核心控制台 -->
    <div class="absolute bottom-10 left-1/2 -translate-x-1/2 interactive flex flex-col items-center space-y-4">
        
        <!-- 階段顯示 -->
        <div class="flex space-x-4 mb-4">
            <div id="step-1-indicator" class="glass-panel px-6 py-3 text-center step-active transition-all">
                <div class="text-[10px] text-yellow-400 font-bold uppercase">Step 1</div>
                <div class="text-white font-bold">抽出幸運兒</div>
            </div>
            <div id="step-2-indicator" class="glass-panel px-6 py-3 text-center opacity-40 transition-all">
                <div class="text-[10px] text-yellow-400 font-bold uppercase">Step 2</div>
                <div class="text-white font-bold">抽取獎項</div>
            </div>
        </div>

        <!-- 按鈕區 -->
        <div class="relative group">
            <button id="main-action-btn" class="bg-gradient-to-r from-red-600 to-yellow-500 text-white px-16 py-6 rounded-full text-3xl font-black shadow-[0_0_40px_rgba(234,179,8,0.4)] transition-all hover:scale-110 active:scale-95 disabled:opacity-50 disabled:grayscale">
                抽 幸 運 兒
            </button>
        </div>

        <div id="current-lucky-person" class="text-white text-xl font-bold bg-black/40 px-8 py-2 rounded-full border border-yellow-500/30 opacity-0 transition-opacity">
            幸運兒：<span class="text-yellow-400" id="lucky-name-display">--</span>
        </div>
    </div>

    <!-- 得獎彈窗 -->
    <div id="result-modal" class="fixed inset-0 bg-black/90 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-500 z-50 interactive">
        <div class="text-center p-10 glass-panel border-yellow-500/50 scale-75 transition-transform duration-500" id="modal-content">
            <div class="text-yellow-400 text-xl mb-1 font-bold tracking-widest">🎉 恭喜獲獎 🎉</div>
            <div id="modal-name" class="text-white text-4xl font-bold mb-2"></div>
            <div class="text-white/60 mb-4 italic text-sm">獲得了</div>
            <div id="modal-prize" class="text-yellow-400 text-6xl font-black mb-10 drop-shadow-[0_0_20px_rgba(251,191,36,0.6)]"></div>
            <button id="close-modal" class="bg-yellow-500 text-black px-12 py-3 rounded-full font-black text-lg hover:bg-yellow-400 transition-all">太棒了！</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // --- Firebase 初始化 ---
    const firebaseConfig = JSON.parse(__firebase_config);
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

    // --- 初始化變數 ---
    let scene, camera, renderer, world;
    let balls = [];
    const BALL_RADIUS = 0.5;
    
    let participants = [];
    let prizes = [];
    let winners = [];
    let currentUser = null;

    let currentStep = 1; // 1: 抽人, 2: 抽獎
    let selectedWinnerName = null;
    let isProcessing = false;

    // --- Firebase 儲存邏輯 ---
    async function saveState() {
        if (!currentUser) return;
        try {
            const data = { participants, prizes, winners, lastUpdated: Date.now() };
            // 修正路徑片段數為偶數
            await setDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'state', 'lottery'), data);
            document.getElementById('save-status').innerText = "雲端同步成功 " + new Date().toLocaleTimeString();
        } catch (e) { console.error("Save Error:", e); }
    }

    async function loadState(user) {
        try {
            const snap = await getDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'state', 'lottery'));
            if (snap.exists()) {
                const data = snap.data();
                participants = data.participants || [];
                prizes = data.prizes || [];
                winners = data.winners || [];
                document.getElementById('names-input').value = participants.join('\n');
                document.getElementById('prize-config').value = prizes.map(p => `${p.name}, ${p.total}`).join('\n');
                renderWinnersList();
                refreshConfig(false);
            }
        } catch (e) { console.error("Load Error:", e); }
        document.getElementById('loading-overlay').style.opacity = '0';
        setTimeout(() => document.getElementById('loading-overlay').style.display = 'none', 500);
    }

    // --- 物理與 3D 效果 ---
    function initScene() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 12);
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        world = new CANNON.World();
        world.gravity.set(0, -9.82, 0);

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const pLight = new THREE.PointLight(0xffdd00, 1.2);
        pLight.position.set(5, 10, 5);
        scene.add(pLight);

        scene.add(new THREE.Mesh(new THREE.IcosahedronGeometry(6, 1), new THREE.MeshPhongMaterial({
            color: 0xffffff, transparent: true, opacity: 0.1, wireframe: true
        })));

        const ground = new CANNON.Body({ mass: 0 });
        ground.addShape(new CANNON.Plane());
        ground.quaternion.setFromAxisAngle(new CANNON.Vec3(1,0,0), -Math.PI/2);
        ground.position.y = -5;
        world.addBody(ground);
    }

    function createVisualBall(name) {
        const body = new CANNON.Body({
            mass: 1, shape: new CANNON.Sphere(BALL_RADIUS),
            position: new CANNON.Vec3((Math.random()-0.5)*5, Math.random()*5, (Math.random()-0.5)*5)
        });
        world.addBody(body);

        const group = new THREE.Group();
        const color = new THREE.Color(`hsl(${Math.random()*360}, 70%, 60%)`);
        group.add(new THREE.Mesh(new THREE.SphereGeometry(BALL_RADIUS, 16, 16), new THREE.MeshPhongMaterial({ color })));

        const canvas = document.createElement('canvas');
        canvas.width = 64; canvas.height = 64;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = 'white'; ctx.fillRect(0,0,64,64);
        ctx.fillStyle = 'black'; ctx.font = 'bold 30px Arial'; ctx.textAlign = 'center'; ctx.textBaseline='middle';
        ctx.fillText(name.substring(0, 1), 32, 32);

        const sprite = new THREE.Mesh(
            new THREE.SphereGeometry(BALL_RADIUS+0.01, 16, 16),
            new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true, opacity: 0.8 })
        );
        group.add(sprite);
        scene.add(group);
        return { body, visual: group, name };
    }

    // --- 遊戲邏輯 ---
    function refreshConfig(shouldSave = true) {
        const names = document.getElementById('names-input').value.split('\n').map(s=>s.trim()).filter(s=>s);
        participants = names;

        const prizeInput = document.getElementById('prize-config').value;
        prizes = prizeInput.split('\n').map(line => {
            const [n, t] = line.split(',').map(s=>s.trim());
            return { name: n || "禮物", total: parseInt(t) || 0, current: parseInt(t) || 0 };
        }).filter(p => p.total > 0);

        balls.forEach(b => { world.remove(b.body); scene.remove(b.visual); });
        balls = [];
        const activeNames = participants.filter(n => !winners.some(w => w.name === n));
        activeNames.forEach(n => balls.push(createVisualBall(n)));
        
        document.getElementById('ball-count-badge').innerText = `球: ${balls.length}`;
        resetToStep1();
        if (shouldSave) saveState();
    }

    function resetToStep1() {
        currentStep = 1;
        selectedWinnerName = null;
        const btn = document.getElementById('main-action-btn');
        btn.innerText = "抽 幸 運 兒";
        btn.disabled = balls.length === 0;
        
        document.getElementById('step-1-indicator').classList.add('step-active');
        document.getElementById('step-1-indicator').classList.remove('opacity-40');
        document.getElementById('step-2-indicator').classList.remove('step-active');
        document.getElementById('step-2-indicator').classList.add('opacity-40');
        document.getElementById('current-lucky-person').classList.add('opacity-0');
    }

    function goToStep2(luckyName) {
        currentStep = 2;
        selectedWinnerName = luckyName;
        const btn = document.getElementById('main-action-btn');
        btn.innerText = "抽 取 獎 項";
        
        document.getElementById('step-2-indicator').classList.add('step-active');
        document.getElementById('step-2-indicator').classList.remove('opacity-40');
        document.getElementById('step-1-indicator').classList.remove('step-active');
        document.getElementById('step-1-indicator').classList.add('opacity-40');
        
        document.getElementById('lucky-name-display').innerText = luckyName;
        document.getElementById('current-lucky-person').classList.remove('opacity-0');
        
        const totalPrizesLeft = prizes.reduce((acc, p) => acc + p.current, 0);
        if (totalPrizesLeft <= 0) {
            btn.innerText = "獎項已抽完";
            btn.disabled = true;
        }
    }

    function handleMainAction() {
        if (isProcessing) return;
        
        if (currentStep === 1) {
            isProcessing = true;
            const btn = document.getElementById('main-action-btn');
            btn.disabled = true;
            btn.innerText = "正在尋找幸運兒...";
            
            balls.forEach(b => b.body.velocity.set((Math.random()-0.5)*30, 25, (Math.random()-0.5)*30));
            
            setTimeout(() => {
                if (balls.length === 0) return;
                const idx = Math.floor(Math.random() * balls.length);
                const winnerBall = balls[idx];
                goToStep2(winnerBall.name);
                isProcessing = false;
                btn.disabled = false;
            }, 2000);

        } else if (currentStep === 2) {
            isProcessing = true;
            const btn = document.getElementById('main-action-btn');
            btn.disabled = true;
            btn.innerText = "正在決定獎項...";

            setTimeout(() => {
                let pool = [];
                prizes.forEach((p, idx) => {
                    for(let i=0; i<p.current; i++) pool.push(idx);
                });
                
                if (pool.length === 0) {
                    alert("沒有獎項了！");
                    isProcessing = false;
                    return;
                }

                const prizeIdx = pool[Math.floor(Math.random() * pool.length)];
                const prize = prizes[prizeIdx];
                prize.current--;
                
                winners.push({ name: selectedWinnerName, prize: prize.name, time: Date.now() });
                
                const ballIdx = balls.findIndex(b => b.name === selectedWinnerName);
                if (ballIdx > -1) {
                    world.remove(balls[ballIdx].body);
                    scene.remove(balls[ballIdx].visual);
                    balls.splice(ballIdx, 1);
                }

                showResult(selectedWinnerName, prize.name);
                renderWinnersList();
                document.getElementById('ball-count-badge').innerText = `球: ${balls.length}`;
                
                isProcessing = false;
                saveState();
                resetToStep1();
            }, 1500);
        }
    }

    function showResult(name, prize) {
        document.getElementById('modal-name').innerText = name;
        document.getElementById('modal-prize').innerText = prize;
        document.getElementById('result-modal').classList.remove('opacity-0', 'pointer-events-none');
        document.getElementById('modal-content').classList.remove('scale-75');
        confetti({ particleCount: 250, spread: 100, origin: { y: 0.6 } });
    }

    function renderWinnersList() {
        const container = document.getElementById('winners-list');
        if (winners.length === 0) {
            container.innerHTML = '<p class="opacity-50 italic text-center">尚未中獎...</p>';
            return;
        }
        container.innerHTML = winners.map(w => `
            <div class="bg-white/10 p-2 rounded border-l-4 border-yellow-500 flex justify-between">
                <span class="font-bold">${w.name}</span>
                <span class="text-yellow-400">${w.prize}</span>
            </div>
        `).reverse().join('');
    }

    function animate() {
        requestAnimationFrame(animate);
        world.step(1/60);
        balls.forEach(b => {
            b.visual.position.copy(b.body.position);
            b.visual.quaternion.copy(b.body.quaternion);
            if (b.body.velocity.length() < 1) {
                b.body.applyImpulse(new CANNON.Vec3((Math.random()-0.5)*2, 6, (Math.random()-0.5)*2), b.body.position);
            }
        });
        renderer.render(scene, camera);
    }

    // --- Firebase Auth 監聽 ---
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUser = user;
            await loadState(user);
        } else {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
        }
    });

    // --- 初始化執行 ---
    window.onload = () => {
        initScene();
        animate();
        refreshConfig(false);

        document.getElementById('update-btn').onclick = () => refreshConfig(true);
        document.getElementById('main-action-btn').onclick = handleMainAction;
        document.getElementById('close-modal').onclick = () => {
            document.getElementById('result-modal').classList.add('opacity-0', 'pointer-events-none');
            document.getElementById('modal-content').classList.add('scale-75');
        };
        document.getElementById('clear-btn').onclick = () => {
            if (confirm("清除紀錄並重置獎項數量？")) {
                winners = [];
                renderWinnersList();
                refreshConfig(true);
            }
        };

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    };
</script>
</body>
</html>
